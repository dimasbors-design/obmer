<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Часы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Часы">
<style>
html,body{margin:0;padding:0;height:100%;background:#000;color:#f2f2f2;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;
  -webkit-user-select:none;-webkit-text-size-adjust:100%;}
#wrap{position:absolute;top:0;left:0;right:0;bottom:0;}
/* ---- горизонтально: часы слева, календарь справа, события полосой внизу ---- */
#left{position:absolute;top:2vh;left:0;width:56%;height:68vh;text-align:center;}
#right{position:absolute;top:1vh;right:1%;width:43%;height:69vh;}
#bottom{position:absolute;top:71vh;left:21.5%;right:1%;bottom:0;text-align:center;padding-top:2vh;overflow:hidden;font-size:5.6vw;-webkit-box-sizing:border-box;box-sizing:border-box;}
#line{position:absolute;top:71vh;left:3%;right:3%;border-top:1px solid #222;}
#vline{position:absolute;top:73vh;bottom:2vh;left:20.5%;border-left:1px solid #222;}
#time{font-size:19.5vw;font-weight:300;line-height:1;letter-spacing:-0.02em;}
#sec{font-size:4.4vw;color:#777;font-weight:300;vertical-align:top;margin-left:0.3vw;}
#dow{font-size:7vw;margin-top:0.6vw;color:#ffb84d;font-weight:300;}
#date{display:none;} /* строка с числом и годом убрана по просьбе */
#weather{font-size:5.4vw;margin-top:1.2vw;color:#8cc8ff;font-weight:300;line-height:1.15;}
#weather small{font-size:0.62em;color:#7aaedc;}
#mon{text-align:center;white-space:nowrap;font-size:3.8vw;margin:0.4vw 0 0.8vw;font-weight:300;color:#ddd;}
.nav{display:inline-block;padding:0 1.5vw;font-size:1.5em;line-height:0.8;vertical-align:-0.1em;color:#888;cursor:pointer;}
table{margin:0 auto;border-collapse:collapse;}
td,th{width:6.2vw;height:6.6vw;text-align:center;font-size:4vw;font-weight:400;}
th{color:#999;font-size:2.6vw;height:4vw;}
td{cursor:pointer;}
td.we,th.we{color:#ff7a6b;}
td.other{color:#333;}
table td.hs{color:#ff4a3a;font-weight:600;text-decoration:underline;}
table td.hc{color:#ffd27a;text-decoration:underline;}
table td.hp{color:#7fd6a0;font-weight:600;text-decoration:underline;}
table td.hm{color:#c3a6ff;text-decoration:underline;}
table td.sel{outline:0.3vw solid #8cc8ff;}
td.today span{display:inline-block;width:5.8vw;height:5.8vw;line-height:5.8vw;
  border-radius:50%;background:#ffb84d;color:#000;font-weight:500;}
#ev{font-size:1em;color:#ffd27a;font-weight:400;line-height:1.25;}
#soon{font-size:0.75em;margin-top:1.6vh;color:#bbb;font-weight:300;line-height:1.25;}
#sel{display:none;font-size:0.9em;color:#eee;font-weight:300;line-height:1.25;}
#sel b{font-weight:500;color:#8cc8ff;} #sel .none{color:#888;}
#bottom.selmode #ev,#bottom.selmode #soon{display:none;}
#bottom.selmode #sel{display:block;}
#nw{display:none;font-size:0.85em;color:#eee;font-weight:300;line-height:1.25;}
#nw small{display:block;font-size:0.6em;color:#8cc8ff;margin-bottom:1vh;}
#bottom.newsmode #ev,#bottom.newsmode #soon,#bottom.newsmode #sel{display:none;}
#bottom.newsmode #nw{display:block;}
.tm.news{border-color:#357;color:#8cc8ff;}
/* ---- кухонные таймеры ---- */
#left{cursor:pointer;}
#timers{position:absolute;top:73vh;left:1%;width:19%;bottom:1vh;text-align:center;}
#timers .tm{display:block;width:auto;margin:0 0 1vh 0;text-align:center;font-size:3.6vw;white-space:nowrap;padding-left:0;padding-right:0;}
.tm{display:inline-block;margin:0 0.6vw;padding:0.6vw 0.8vw;border:2px solid #3a6;border-radius:1.2vw;
  font-size:4.4vw;color:#9f9;cursor:pointer;line-height:1.15;}
.tm small{font-size:0.5em;color:#7b7;margin-right:0.6vw;}
.tm.add{border-color:#333;color:#777;}
.tm.done{border-color:#f44;color:#fff;background:#a00;}
.tm.done.blink{background:#000;color:#f66;}
#ov{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:10;text-align:center;}
#ov.on{display:block;}
#ovt{font-size:15vw;font-weight:300;color:#9f9;margin-top:3vh;line-height:1;}
.pb{display:inline-block;width:12vw;margin:0.8vw;padding:1.6vw 0;font-size:4vw;border:2px solid #444;border-radius:1.4vw;
  color:#eee;cursor:pointer;}
.pb.go{width:30vw;border-color:#3a6;color:#9f9;}
.pb.no{width:30vw;color:#aaa;}
.pb.sm{color:#8cc8ff;width:17vw;}
.pb{white-space:nowrap;}
.night .tm{color:#7a3;border-color:#352;}
@media (orientation:portrait){
  #timers{top:81vh;left:1%;width:19%;}
  #timers .tm{font-size:3.7vw;margin:0 0 0.8vh 0;} #timers .tm.news{font-size:3.2vw;}
  #line{top:79.5vh;} #vline{top:81vh;left:20.5%;}
  #ovt{font-size:24vw;margin-top:8vh;}
  .pb{width:13.4vw;font-size:5.6vw;padding:2.6vw 0;margin:0.7vw;}
  .pb.sm{width:21vw;font-size:4.8vw;}
  .pb.go,.pb.no{width:42vw;}
}
/* ---- свет (график отключений) и второй экран ---- */
#power{font-size:4.2vw;margin-top:1vw;color:#f0b060;font-weight:300;line-height:1.15;cursor:pointer;}
#power.off{color:#ff6a5a;font-weight:400;}
#pg2{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:9;padding:3vh 3vw;
  -webkit-box-sizing:border-box;box-sizing:border-box;}
#pg2.on{display:block;}
#pg2 h2{margin:0 0 1vh;font-size:3.4vw;font-weight:300;color:#f0b060;}
#amap{position:absolute;left:1.5vw;top:2vh;width:62vw;}
#amap svg{display:block;width:100%;height:auto;}
#amap path{stroke:#000;stroke-width:1.5;fill:#24452c;}
#amap path.a{fill:#b3261e;} #amap path.p{fill:#c9772a;} #amap path.na{fill:#333;}
#amap path.me{stroke:#ffb84d;stroke-width:5;}
#aside{position:absolute;left:65vw;right:2vw;top:3vh;}
.abig{background:#b3261e;color:#fff;border-radius:1vw;padding:1.4vw 1.6vw;font-size:3.4vw;font-weight:500;line-height:1.15;}
.abig small{display:block;font-size:0.6em;font-weight:300;margin-top:0.6vw;}
.abig.ok{background:#24452c;} .abig.na{background:#333;}
.asm{font-size:1.8vw;color:#999;margin-top:1.4vh;line-height:1.35;}
.alg{font-size:1.7vw;color:#bbb;margin-top:1.4vh;line-height:1.6;}
.alg i{display:inline-block;width:1.4vw;height:1.4vw;margin-right:0.6vw;vertical-align:-0.1vw;}
#ppow{position:absolute;left:3vw;right:3vw;top:60vh;}
#alarm{display:none;position:absolute;top:71.5vh;left:21.5%;right:1%;bottom:1vh;background:#b3261e;color:#fff;text-align:center;
  border-radius:1vw;z-index:5;padding-top:2.5vh;-webkit-box-sizing:border-box;box-sizing:border-box;font-size:6vw;font-weight:500;line-height:1.1;cursor:pointer;}
#alarm.on{display:block;}
#alarm small{display:block;font-size:0.45em;font-weight:300;margin-top:1.4vh;}
.night #alarm{background:#400;color:#c66;}
#pg2 h2 small{font-size:0.6em;color:#888;margin-left:2vw;}
.prow{margin:0 0 1.2vh;}
.plab{font-size:2.3vw;color:#ddd;margin-bottom:0.8vh;font-weight:300;}
.plab b{font-weight:400;color:#ff8a7a;}
.pbar{position:relative;height:4.5vh;border:1px solid #333;}
.pc{position:absolute;top:0;bottom:0;border-left:1px solid #000;}
.pc.on{background:#2f6b3a;} .pc.off{background:#7a1f1a;}
.pnow{position:absolute;top:-1vh;bottom:-1vh;border-left:3px solid #ffb84d;}
.phr{position:relative;height:2.8vh;font-size:1.7vw;color:#888;}
.phr span{position:absolute;top:0.4vh;margin-left:-1.5vw;width:3vw;text-align:center;}
#pg2 .hint{position:absolute;bottom:1vh;left:3vw;right:3vw;font-size:1.6vw;color:#555;text-align:center;}
#pg2 .na{color:#888;}
.night #power,.night #pg2 h2,.night .plab{color:#622;} .night .pc.on{background:#132;} .night .pc.off{background:#311;}
@media (orientation:portrait){ #power{font-size:4.8vw;margin-top:0.4vw;} #pg2 h2{font-size:5vw;} .plab{font-size:3.4vw;} .phr{font-size:2.6vw;} #pg2 .hint{font-size:2.4vw;}
  #amap{left:2vw;top:1.5vh;width:96vw;} #aside{left:3vw;right:3vw;top:50vh;} .abig{font-size:5vw;} .asm{font-size:3vw;} .alg{display:none;}
  #ppow{top:68.5vh;} #alarm{top:80vh;font-size:8vw;} #alarm small{font-size:0.4em;} }
/* ---- ночь ---- */
.night #time{color:#a33;} .night #sec{color:#511;}
.night #dow,.night #date,.night #mon,.night td,.night #weather{color:#622;}
.night #ev,.night #soon,.night #sel,.night #sel b,.night .nav{color:#622;}
.night th{color:#411;} .night #line,.night #vline{border-color:#200;}
.night table td.hs,.night table td.hc,.night table td.hp,.night table td.hm{color:#833;} .night td.other{color:#200;}
.night td.today span{background:#622;color:#000;}
/* ---- вертикально: часы сверху, календарь посередине, события внизу ---- */
@media (orientation:portrait){
  #left{top:0.5vh;width:100%;height:37vh;}
  #right{top:38vh;left:0;right:0;width:100%;height:41vh;}
  #bottom{top:79.5vh;left:21.5%;padding-top:1.4vh;}
  #time{font-size:25vw;} #sec{font-size:6.5vw;} #dow{font-size:6.8vw;margin-top:0;}
  #date{font-size:6vw;} #weather{font-size:5.8vw;margin-top:0.6vw;} #weather br{display:none;} #weather small{margin-left:3vw;} #mon{font-size:6vw;}
  td,th{width:12.5vw;height:7vw;font-size:6vw;} th{font-size:4vw;height:5.5vw;}
  td.today span{width:8vw;height:8vw;line-height:8vw;}
  #bottom{font-size:6.4vw;}
  .nav{padding:0 6vw;}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div><span id="time">--:--</span><span id="sec">--</span></div>
    <div id="dow"></div>
    <div id="date"></div>
    <div id="weather"></div>
    <div id="power"></div>
  </div>
  <div id="right">
    <div id="mon"></div>
    <table id="cal"></table>
  </div>
  <div id="line"></div>
  <div id="vline"></div>
  <div id="timers"></div>
  <div id="bottom">
    <div id="ev"></div>
    <div id="soon"></div>
    <div id="sel"></div>
    <div id="nw"></div>
  </div>
  <div id="alarm"></div>
  <div id="pg2">
    <div id="amap"></div>
    <div id="aside"></div>
    <div id="ppow">
      <h2>Свет, очередь <span id="pq"></span><small id="pupd"></small></h2>
      <div id="pdays"></div>
    </div>
    <div class="hint">смахните или нажмите, чтобы вернуться к часам · данные: siren.pp.ua, Світлобот</div>
  </div>
  <div id="ov">
    <div id="ovt">05:00</div>
    <div style="margin-top:2vh">
      <span class="pb" data-m="1">1</span><span class="pb" data-m="3">3</span><span class="pb" data-m="5">5</span><span class="pb" data-m="7">7</span><span class="pb" data-m="10">10</span><span class="pb" data-m="15">15</span>
      <br><span class="pb" data-m="20">20</span><span class="pb" data-m="25">25</span><span class="pb" data-m="30">30</span><span class="pb" data-m="40">40</span><span class="pb" data-m="45">45</span><span class="pb" data-m="60">60</span>
      <br><span class="pb sm" data-a="-60">&minus;1 мин</span><span class="pb sm" data-a="60">+1 мин</span><span class="pb sm" data-a="-10">&minus;10 с</span><span class="pb sm" data-a="10">+10 с</span>
      <br><span class="pb no" data-x="cancel">Отмена</span><span class="pb go" data-x="start">Старт</span>
    </div>
  </div>
</div>
<script src="/obmer/clock/ukraine-map.js"></script>
<script>
(function(){
  // ===== НАСТРОЙКИ =====
  var NIGHT_FROM = 23;   // с какого часа ночной режим (тусклый красный)
  var NIGHT_TO   = 7;    // до какого часа
  // =====================
  var DOW = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  var DOW_S = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MON_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  // ===== ЛИЧНЫЕ СОБЫТИЯ =====
  // Хранятся зашифрованными в family.enc. Ключ приходит в ссылке (#k=...) и запоминается на iPad.
  // Формат после расшифровки: ['ДД.ММ', 'Текст', год или null, тип]
  // тип: 'b' день рождения, 'bd' день рождения того, кого нет, 'm' день памяти, 'w' годовщина свадьбы
  var MY = [];
  function sha256(m){ // m: двоичная строка, результат: двоичная строка (32 байта)
    var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var l=m.length*8; m+='\x80'; while(m.length%64!==56) m+='\x00';
    m+='\x00\x00\x00\x00'+String.fromCharCode((l>>>24)&255,(l>>>16)&255,(l>>>8)&255,l&255);
    var W=new Array(64), i, j, a,b,c,d,e,f,g,h,t1,t2;
    function r(x,n){ return (x>>>n)|(x<<(32-n)); }
    for(i=0;i<m.length;i+=64){
      for(j=0;j<16;j++) W[j]=(m.charCodeAt(i+4*j)<<24)|(m.charCodeAt(i+4*j+1)<<16)|(m.charCodeAt(i+4*j+2)<<8)|m.charCodeAt(i+4*j+3);
      for(j=16;j<64;j++){ var s0=r(W[j-15],7)^r(W[j-15],18)^(W[j-15]>>>3), s1=r(W[j-2],17)^r(W[j-2],19)^(W[j-2]>>>10); W[j]=(W[j-16]+s0+W[j-7]+s1)|0; }
      a=H[0];b=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
      for(j=0;j<64;j++){
        t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[j]+W[j])|0;
        t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    var o=''; for(i=0;i<8;i++) o+=String.fromCharCode((H[i]>>>24)&255,(H[i]>>>16)&255,(H[i]>>>8)&255,H[i]&255);
    return o;
  }
  function hex(b){ var o=''; for(var i=0;i<b.length;i++){ var c=b.charCodeAt(i); o+=(c<16?'0':'')+c.toString(16); } return o; }
  function clockKey(){
    // ключ берём из ссылки (?k=... или #k=...), иначе из памяти iPad
    var m=/[?&#]k=([^&#]+)/.exec(location.search+location.hash), k=m?decodeURIComponent(m[1]):null;
    try{ if(k) localStorage.setItem('clockKey',k); else k=localStorage.getItem('clockKey'); }catch(e){}
    // значок «На экран Домой» на iOS 9 теряет #..., поэтому переносим ключ в адрес (?k=...)
    if(k && location.search.indexOf('k=')<0 && window.history && history.replaceState){
      try{ history.replaceState(null,'',location.pathname+'?k='+encodeURIComponent(k)); }catch(e){}
    }
    return k;
  }
  function loadFamily(){
    var k=clockKey(); if(!k) return;
    var x=new XMLHttpRequest();
    x.open('GET','/obmer/clock/family.enc?t='+new Date().getTime(),true);
    x.onreadystatechange=function(){
      if(x.readyState!==4||x.status!==200) return;
      try{
        var j=JSON.parse(x.responseText), c=atob(j.c), ks='', i=0, p='';
        while(ks.length<c.length){ ks+=sha256(k+'|'+j.n+'|'+i); i++; }
        for(i=0;i<c.length;i++) p+=String.fromCharCode(c.charCodeAt(i)^ks.charCodeAt(i));
        if(hex(sha256(k+'|mac|'+j.n+'|'+p)).substr(0,16)!==j.m) return; // неверный ключ
        MY = JSON.parse(decodeURIComponent(escape(p)));
        evCache = {}; lastDay = -1; // перерисовать календарь и события
      }catch(e){}
    };
    x.send();
  }
  // ============================

  // Государственные праздники Украины (с 2024 г.) и церковные по новому календарю ПЦУ/УГКЦ (с 2023 г.)
  var FIXED = [
    ['01.01','Новый год','s'],
    ['06.01','Крещение Господне (Богоявление)','c'],
    ['02.02','Сретение Господне','c'],
    ['08.03','Международный женский день','s'],
    ['25.03','Благовещение','c'],
    ['01.05','День труда','s'],
    ['08.05','День памяти и победы над нацизмом','s'],
    ['28.06','День Конституции Украины','s'],
    ['29.06','Святых Петра и Павла','c'],
    ['15.07','День украинской государственности (св. Владимира)','s'],
    ['06.08','Преображение Господне (Яблочный Спас)','c'],
    ['14.08','Медовый Спас (Маковей)','c'],
    ['15.08','Успение Богородицы','c'],
    ['24.08','День Независимости Украины','s'],
    ['29.08','Усекновение главы Иоанна Предтечи','c'],
    ['08.09','Рождество Богородицы','c'],
    ['14.09','Воздвижение Креста Господня','c'],
    ['01.10','День защитников и защитниц Украины, Покрова','s'],
    ['21.11','Введение во храм Богородицы','c'],
    ['06.12','День святого Николая','c'],
    ['25.12','Рождество Христово','s']
  ];
  // Православная Пасха (юлианская), даты по новому стилю, годы 1900-2099
  function easter(y){
    var a=y%4, b=y%7, c=y%19, d=(19*c+15)%30, e=(2*a+4*b-d+34)%7;

    for(i=0;i<FIXED.length;i++){ f=FIXED[i]; add(+f[0].substr(3,2)-1, +f[0].substr(0,2), f[1], f[2]); }
    var E = easter(y);
    function rel(n,txt,t){ var x=new Date(E.getFullYear(),E.getMonth(),E.getDate()+n); add(x.getMonth(),x.getDate(),txt,t); }
    rel(-7,'Вербное воскресенье','c');

    kyiv:'Киевская',kirovohrad:'Кировоградская',luhansk:'Луганская',lviv:'Львовская',mykolaiv:'Николаевская',odessa:'Одесская',
    poltava:'Полтавская',rivne:'Ровенская',sumy:'Сумская',ternopil:'Тернопольская',kharkiv:'Харьковская',kherson:'Херсонская',
    khmelnytskyi:'Хмельницкая',cherkasy:'Черкасская',chernivtsi:'Черновицкая',chernihiv:'Черниговская','kyiv-city':'г. Киев'};
  function hhmm(ms){ var d=new Date(ms); return p2(d.getHours())+':'+p2(d.getMinutes()); }
  function obl(n){ var a=n%10,b=n%100; if(a===1&&b!==11) return 'области'; return 'областях'; }
  var mapBuilt=false;
  function buildMap(){
    if(mapBuilt || !window.UA_MAP) return;
    var h='<svg viewBox="0 0 1000 670" xmlns="http://www.w3.org/2000/svg">', me='';
    for(var id in UA_MAP){ if(!UA_MAP.hasOwnProperty(id)) continue;
      var pth='<path id="r-'+id+'" d="'+UA_MAP[id]+'"/>';
      if(id===MYREG) me=pth; else h+=pth; }
    $('amap').innerHTML = h+me+'</svg>'; // своя область последней, чтобы жёлтая обводка была сверху
    mapBuilt=true;
  }
  function drawAlerts(){
    var now=new Date().getTime(), fresh = AL && AL.u && now-AL.u < 40*60*1000;
    var a = fresh ? (AL.a||{}) : {}, vp = fresh ? (AL.vp||[]) : [];
    var full = a[MYREG], part = !full && vp.length;
    var on = !!(fresh && (full || part));
    // красная полоса на главном экране
    var el=$('alarm');
    if(on){
      var since = full ? full : vp[0][1], where = full ? 'Винницкая область' : vp.length===1 ? vp[0][0] : 'часть области';
      el.innerHTML='ТРЕВОГА<small>'+where+(since?', с '+hhmm(since):'')+' · данные от '+hhmm(AL.u)+'</small>';
      el.className='on';
    } else el.className='';
    // карта
    buildMap();
    if(mapBuilt){
      for(var id in UA_MAP){ if(!UA_MAP.hasOwnProperty(id)) continue;
        var pe=document.getElementById('r-'+id); if(!pe) continue;
        var c = !fresh ? 'na' : a[id] ? 'a' : (id===MYREG && part) ? 'p' : '';
        if(id===MYREG) c+=' me';
        pe.setAttribute('class', c); }
    }
    // справа
    var n=0; for(var k in a) if(a.hasOwnProperty(k)) n++;
    var s;
    if(!fresh) s='<div class="abig na">Нет свежих данных<small>'+(AL&&AL.u?'последние от '+hhmm(AL.u):'о тревогах')+'</small></div>';
    else if(on) s='<div class="abig">ТРЕВОГА<small>'+(full?'Винницкая область':names2(vp))+(full||vp[0][1]?', с '+hhmm(full||vp[0][1]):'')+'</small></div>';
    else s='<div class="abig ok">Спокойно<small>Винницкая область</small></div>';
    if(fresh) s+='<div class="asm">'+(n?'Тревога в '+n+' '+obl(n):'Тревог нет нигде')+'<br>данные от '+hhmm(AL.u)+' (опоздание до 15 мин)</div>';
    s+='<div class="alg"><i style="background:#b3261e"></i>тревога<br><i style="background:#c9772a"></i>часть области<br>'+
      '<i style="background:#24452c"></i>спокойно<br><i style="background:#333"></i>нет данных<br><i style="border:0.3vw solid #ffb84d;-webkit-box-sizing:border-box;box-sizing:border-box"></i>наша область</div>';
    $('aside').innerHTML=s;
    // начало тревоги: на минуту показать карту и пикнуть (ночью без звука)
    var start = (wasAlarm===false && on);
    if(fresh) wasAlarm=on;
    if(start){
      if(document.body.className!=='night') beep();
      if($('ov').className.indexOf('on')<0) showPg2(true, 60*1000);
    }
  }
  function names2(vp){ var r=[]; for(var i=0;i<vp.length;i++) r.push(vp[i][0]); return r.join(', '); }
  function loadAlerts(){
    var x=new XMLHttpRequest();
    x.open('GET','/obmer/clock/alerts.json?t='+new Date().getTime(),true);
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      if(x.status===200){ try{ AL=JSON.parse(x.responseText); }catch(e){} }
      drawAlerts();
    };
    x.send();
  }
  loadAlerts(); setInterval(loadAlerts, 2*60*1000);

  // ===== Погода =====
  // Без параметров: файл weather.json с этого же сайта (его раз в час обновляет GitHub, Винница).
  // Старый iOS 9 не открывает сервис погоды напрямую из-за сертификата, а наш сайт открывает.
  // Другой город: ?lat=..&lon=.. (запрос прямо в Open-Meteo, на iOS 9 может не работать).
  function qs(name){
    var m = new RegExp('[?&]'+name+'=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var lat = qs('lat'), lon = qs('lon');
  var WX = {0:'ясно',1:'малооблачно',2:'облачно',3:'пасмурно',45:'туман',48:'туман',
    51:'морось',53:'морось',55:'морось',61:'дождь',63:'дождь',65:'ливень',
    71:'снег',73:'снег',75:'сильный снег',77:'снег',80:'ливень',81:'ливень',82:'ливень',
    85:'снегопад',86:'снегопад',95:'гроза',96:'гроза',99:'гроза'};
  function weather(){
    var x = new XMLHttpRequest();
    var url = (lat&&lon) ? 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1'
      : '/obmer/clock/weather.json?t='+new Date().getTime();
    x.open('GET',url,true);
    x.onreadystatechange = function(){
      if(x.readyState!==4) return;
      if(x.status!==200){ if(!$('weather').innerHTML) $('weather').innerHTML='<small>погода: нет связи ('+x.status+')</small>'; setTimeout(weather, 60000); return; }
      try{
        var j = JSON.parse(x.responseText), c = j.current_weather;
        // устаревшие данные (старше 4 часов) не показываем
        var tm = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(c.time||'');
        if(tm){ var wt = new Date(+tm[1], +tm[2]-1, +tm[3], +tm[4], +tm[5]).getTime();
          if(new Date().getTime()-wt > 4*3600*1000){ $('weather').innerHTML=''; return; } }
        var t = Math.round(c.temperature);
        var s = (t>0?'+':'')+t+'°, '+(WX[c.weathercode]||'');
        if(j.daily){ s += '<br><small>сегодня '+Math.round(j.daily.temperature_2m_min[0])+'…'+Math.round(j.daily.temperature_2m_max[0])+'°</small>'; }
        $('weather').innerHTML = s;
      }catch(e){}
    };
    x.send();
  }
  weather(); setInterval(weather, 30*60*1000);
})();
</script>
</body>
</html>
