<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Часы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Часы">
<style>
html,body{margin:0;padding:0;height:100%;background:#000;color:#f2f2f2;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;
  -webkit-user-select:none;-webkit-text-size-adjust:100%;}
#wrap{position:absolute;top:0;left:0;right:0;bottom:0;}
/* ---- горизонтально: часы слева, календарь справа, события полосой внизу ---- */
#left{position:absolute;top:2vh;left:0;width:56%;height:68vh;text-align:center;}
#right{position:absolute;top:1vh;right:1%;width:43%;height:69vh;}
#bottom{position:absolute;top:71vh;left:21.5%;right:1%;bottom:0;text-align:center;padding-top:2vh;}
#line{position:absolute;top:71vh;left:3%;right:3%;border-top:1px solid #222;}
#vline{position:absolute;top:73vh;bottom:2vh;left:20.5%;border-left:1px solid #222;}
#time{font-size:19.5vw;font-weight:300;line-height:1;letter-spacing:-0.02em;}
#sec{font-size:4.4vw;color:#777;font-weight:300;vertical-align:top;margin-left:0.3vw;}
#dow{font-size:7vw;margin-top:0.6vw;color:#ffb84d;font-weight:300;}
#date{display:none;} /* строка с числом и годом убрана по просьбе */
#weather{font-size:5.4vw;margin-top:1.2vw;color:#8cc8ff;font-weight:300;line-height:1.15;}
#weather small{font-size:0.62em;color:#7aaedc;}
#mon{text-align:center;white-space:nowrap;font-size:3.8vw;margin:0.4vw 0 0.8vw;font-weight:300;color:#ddd;}
.nav{display:inline-block;padding:0 1.5vw;font-size:1.5em;line-height:0.8;vertical-align:-0.1em;color:#888;cursor:pointer;}
table{margin:0 auto;border-collapse:collapse;}
td,th{width:6.2vw;height:6.6vw;text-align:center;font-size:4vw;font-weight:400;}
th{color:#999;font-size:2.6vw;height:4vw;}
td{cursor:pointer;}
td.we,th.we{color:#ff7a6b;}
td.other{color:#333;}
table td.hs{color:#ff4a3a;font-weight:600;text-decoration:underline;}
table td.hc{color:#ffd27a;text-decoration:underline;}
table td.hp{color:#7fd6a0;font-weight:600;text-decoration:underline;}
table td.sel{outline:0.3vw solid #8cc8ff;}
td.today span{display:inline-block;width:5.8vw;height:5.8vw;line-height:5.8vw;
  border-radius:50%;background:#ffb84d;color:#000;font-weight:500;}
#ev{font-size:5.6vw;color:#ffd27a;font-weight:400;line-height:1.25;}
#soon{font-size:4.2vw;margin-top:1.6vh;color:#bbb;font-weight:300;line-height:1.25;}
#sel{display:none;font-size:5vw;color:#eee;font-weight:300;line-height:1.25;}
#sel b{font-weight:500;color:#8cc8ff;} #sel .none{color:#888;}
#bottom.selmode #ev,#bottom.selmode #soon{display:none;}
#bottom.selmode #sel{display:block;}
/* ---- кухонные таймеры ---- */
#left{cursor:pointer;}
#timers{position:absolute;top:73vh;left:1%;width:19%;bottom:1vh;text-align:center;}
#timers .tm{display:block;width:auto;margin:0 0 1vh 0;text-align:center;font-size:3.6vw;white-space:nowrap;padding-left:0;padding-right:0;}
.tm{display:inline-block;margin:0 0.6vw;padding:0.6vw 0.8vw;border:2px solid #3a6;border-radius:1.2vw;
  font-size:4.4vw;color:#9f9;cursor:pointer;line-height:1.15;}
.tm small{font-size:0.5em;color:#7b7;margin-right:0.6vw;}
.tm.add{border-color:#333;color:#777;}
.tm.done{border-color:#f44;color:#fff;background:#a00;}
.tm.done.blink{background:#000;color:#f66;}
#ov{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:10;text-align:center;}
#ov.on{display:block;}
#ovt{font-size:15vw;font-weight:300;color:#9f9;margin-top:3vh;line-height:1;}
.pb{display:inline-block;width:12vw;margin:0.8vw;padding:1.6vw 0;font-size:4vw;border:2px solid #444;border-radius:1.4vw;
  color:#eee;cursor:pointer;}
.pb.go{width:30vw;border-color:#3a6;color:#9f9;}
.pb.no{width:30vw;color:#aaa;}
.pb.sm{color:#8cc8ff;width:17vw;}
.pb{white-space:nowrap;}
.night .tm{color:#7a3;border-color:#352;}
@media (orientation:portrait){
  #timers{top:81vh;left:1%;width:19%;}
  #timers .tm{font-size:3.7vw;margin:0 0 0.8vh 0;}
  #line{top:79.5vh;} #vline{top:81vh;left:20.5%;}
  #ovt{font-size:24vw;margin-top:8vh;}
  .pb{width:13.4vw;font-size:5.6vw;padding:2.6vw 0;margin:0.7vw;}
  .pb.sm{width:21vw;font-size:4.8vw;}
  .pb.go,.pb.no{width:42vw;}
}
/* ---- ночь ---- */
.night #time{color:#a33;} .night #sec{color:#511;}
.night #dow,.night #date,.night #mon,.night td,.night #weather{color:#622;}
.night #ev,.night #soon,.night #sel,.night #sel b,.night .nav{color:#622;}
.night th{color:#411;} .night #line,.night #vline{border-color:#200;}
.night table td.hs,.night table td.hc,.night table td.hp{color:#833;} .night td.other{color:#200;}
.night td.today span{background:#622;color:#000;}
/* ---- вертикально: часы сверху, календарь посередине, события внизу ---- */
@media (orientation:portrait){
  #left{top:1vh;width:100%;height:35vh;}
  #right{top:37vh;left:0;right:0;width:100%;height:43vh;}
  #bottom{top:79.5vh;left:21.5%;padding-top:1.4vh;}
  #time{font-size:28vw;} #sec{font-size:7vw;} #dow{font-size:7.5vw;}
  #date{font-size:6vw;} #weather{font-size:6.4vw;} #weather br{display:none;} #weather small{margin-left:3vw;} #mon{font-size:6vw;}
  td,th{width:12.5vw;height:7.6vw;font-size:6vw;} th{font-size:4vw;height:5.5vw;}
  td.today span{width:8vw;height:8vw;line-height:8vw;}
  #ev{font-size:6.4vw;} #soon{font-size:4.8vw;} #sel{font-size:5.4vw;}
  .nav{padding:0 6vw;}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div><span id="time">--:--</span><span id="sec">--</span></div>
    <div id="dow"></div>
    <div id="date"></div>
    <div id="weather"></div>
  </div>
  <div id="right">
    <div id="mon"></div>
    <table id="cal"></table>
  </div>
  <div id="line"></div>
  <div id="vline"></div>
  <div id="timers"></div>
  <div id="bottom">
    <div id="ev"></div>
    <div id="soon"></div>
    <div id="sel"></div>
  </div>
  <div id="ov">
    <div id="ovt">05:00</div>
    <div style="margin-top:2vh">
      <span class="pb" data-m="1">1</span><span class="pb" data-m="3">3</span><span class="pb" data-m="5">5</span><span class="pb" data-m="7">7</span><span class="pb" data-m="10">10</span><span class="pb" data-m="15">15</span>
      <br><span class="pb" data-m="20">20</span><span class="pb" data-m="25">25</span><span class="pb" data-m="30">30</span><span class="pb" data-m="40">40</span><span class="pb" data-m="45">45</span><span class="pb" data-m="60">60</span>
      <br><span class="pb sm" data-a="-60">&minus;1 мин</span><span class="pb sm" data-a="60">+1 мин</span><span class="pb sm" data-a="-10">&minus;10 с</span><span class="pb sm" data-a="10">+10 с</span>
      <br><span class="pb no" data-x="cancel">Отмена</span><span class="pb go" data-x="start">Старт</span>
    </div>
  </div>
</div>
<script>
(function(){
  // ===== НАСТРОЙКИ =====
  var NIGHT_FROM = 23;   // с какого часа ночной режим (тусклый красный)
  var NIGHT_TO   = 7;    // до какого часа
  // =====================
  var DOW = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  var DOW_S = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MON_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  // ===== ЛИЧНЫЕ СОБЫТИЯ =====
  // Формат: ['ДД.ММ', 'Текст', год (можно не писать), 'b' день рождения / 'm' память / 'e' другое]
  // Пример: ['12.03', 'Мама, день рождения', 1960, 'b'],
  var MY = [
  ];
  // ============================

  // Государственные праздники Украины (с 2024 г.) и церковные по новому календарю ПЦУ/УГКЦ (с 2023 г.)
  var FIXED = [
    ['01.01','Новый год','s'],
    ['06.01','Крещение Господне (Богоявление)','c'],
    ['02.02','Сретение Господне','c'],
    ['08.03','Международный женский день','s'],
    ['25.03','Благовещение','c'],
    ['01.05','День труда','s'],
    ['08.05','День памяти и победы над нацизмом','s'],
    ['28.06','День Конституции Украины','s'],
    ['29.06','Святых Петра и Павла','c'],
    ['15.07','День украинской государственности (св. Владимира)','s'],
    ['06.08','Преображение Господне (Яблочный Спас)','c'],
    ['14.08','Медовый Спас (Маковей)','c'],
    ['15.08','Успение Богородицы','c'],
    ['24.08','День Независимости Украины','s'],
    ['29.08','Усекновение главы Иоанна Предтечи','c'],
    ['08.09','Рождество Богородицы','c'],
    ['14.09','Воздвижение Креста Господня','c'],
    ['01.10','День защитников и защитниц Украины, Покрова','s'],
    ['21.11','Введение во храм Богородицы','c'],
    ['06.12','День святого Николая','c'],
    ['25.12','Рождество Христово','s']
  ];
  // Православная Пасха (юлианская), даты по новому стилю, годы 1900-2099
  function easter(y){
    var a=y%4, b=y%7, c=y%19, d=(19*c+15)%30, e=(2*a+4*b-d+34)%7;
    var m=Math.floor((d+e+114)/31), day=((d+e+114)%31)+1;
    return new Date(y, m-1, day+13);
  }
  var evCache = {};
  function key(m,d){return m+'-'+d;}
  function eventsOfYear(y){
    if(evCache[y]) return evCache[y];
    var map = {}, i, f, k;
    function add(m,d,txt,t){ k=key(m,d); (map[k]=map[k]||[]).push({t:txt,k:t}); }
    for(i=0;i<FIXED.length;i++){ f=FIXED[i]; add(+f[0].substr(3,2)-1, +f[0].substr(0,2), f[1], f[2]); }
    var E = easter(y);
    function rel(n,txt,t){ var x=new Date(E.getFullYear(),E.getMonth(),E.getDate()+n); add(x.getMonth(),x.getDate(),txt,t); }
    rel(-7,'Вербное воскресенье','c');
    rel(0,'Пасха (Великдень)','s');
    rel(39,'Вознесение Господне','c');
    rel(49,'Троица','s');
    for(i=0;i<MY.length;i++){
      f=MY[i]; var txt=f[1];
      if(f[2] && (f[3]==='b')) txt += ' ('+(y-f[2])+')';
      else if(f[2] && f[3]==='m') txt += ' ('+(y-f[2])+' л.)';
      add(+f[0].substr(3,2)-1, +f[0].substr(0,2), txt, 'p');
    }
    evCache[y]=map; return map;
  }
  function eventsOn(dt){ return eventsOfYear(dt.getFullYear())[key(dt.getMonth(),dt.getDate())] || []; }
  function names(list){ var r=[]; for(var i=0;i<list.length;i++) r.push(list[i].t); return r.join(' · '); }
  function plural(n){ var a=n%10,b=n%100; if(a===1&&b!==11) return 'день'; if(a>=2&&a<=4&&(b<10||b>=20)) return 'дня'; return 'дней'; }
  function drawEvents(now){
    var t = eventsOn(now);
    $('ev').innerHTML = t.length ? names(t) : '';
    var s='';
    for(var n=1;n<=30;n++){
      var x=new Date(now.getFullYear(),now.getMonth(),now.getDate()+n), l=eventsOn(x);
      if(l.length){ s = (n===1?'Завтра':'Через '+n+' '+plural(n))+': '+names(l); break; }
    }
    $('soon').innerHTML = s;
  }
  function $(id){return document.getElementById(id);}
  function p2(n){return n<10?'0'+n:''+n;}
  var lastDay = -1, startedAt = new Date().getTime();

  // Календарь: можно листать месяцы (‹ ›) и нажимать на даты; через 30 сек возвращается к сегодня
  var viewY, viewM, selKey = null, backTimer = null;
  function drawCal(){
    var now = new Date(), y=viewY, m=viewM;
    $('mon').innerHTML = '<span class="nav" data-nav="-1">&#8249;</span>'+MON_N[m]+' '+y+'<span class="nav" data-nav="1">&#8250;</span>';
    var first = new Date(y,m,1).getDay(); first = (first+6)%7; // Пн=0
    var start = new Date(y,m,1-first);
    var h = '<tr>';
    for(var i=0;i<7;i++) h += '<th'+(i>4?' class="we"':'')+'>'+DOW_S[i]+'</th>';
    h += '</tr>';
    var weeks = Math.ceil((first + new Date(y,m+1,0).getDate())/7);
    for(var w=0;w<weeks;w++){
      h += '<tr>';
      for(var k=0;k<7;k++){
        var c = new Date(start.getFullYear(), start.getMonth(), start.getDate()+w*7+k);
        var cls = [], ck = c.getFullYear()+'-'+c.getMonth()+'-'+c.getDate();
        if(k>4) cls.push('we');
        if(c.getMonth()!==m) cls.push('other');
        else { var el=eventsOn(c), hs=0, hc=0, hp=0;
          for(var q=0;q<el.length;q++){ if(el[q].k==='s') hs=1; else if(el[q].k==='c') hc=1; else hp=1; }
          if(hs) cls.push('hs'); else if(hp) cls.push('hp'); else if(hc) cls.push('hc'); }
        var isT = c.getFullYear()===now.getFullYear() && c.getMonth()===now.getMonth() && c.getDate()===now.getDate();
        if(isT) cls.push('today');
        if(ck===selKey) cls.push('sel');
        h += '<td class="'+cls.join(' ')+'" data-d="'+ck+'">'+(isT?'<span>'+c.getDate()+'</span>':c.getDate())+'</td>';
      }
      h += '</tr>';
    }
    $('cal').innerHTML = h;
  }
  function goToday(){
    var now=new Date(); viewY=now.getFullYear(); viewM=now.getMonth(); selKey=null;
    $('sel').innerHTML=''; $('bottom').className=''; drawCal();
  }
  function armBack(){ if(backTimer) clearTimeout(backTimer); backTimer=setTimeout(goToday, 30000); }
  function showDay(y,m,d){
    var dt=new Date(y,m,d), l=eventsOn(dt);
    var head = d+' '+MON_G[m]+(y!==new Date().getFullYear()?' '+y:'')+', '+DOW[dt.getDay()].toLowerCase();
    $('sel').innerHTML = '<b>'+head+':</b> '+(l.length?names(l):'<span class="none">событий нет</span>');
    $('bottom').className = 'selmode';
  }
  function onTap(e){
    var t = e.target;
    while(t && t!==document.body && !(t.getAttribute && (t.getAttribute('data-d')||t.getAttribute('data-nav')))) t=t.parentNode;
    if(!t || t===document.body) return;
    var nav=t.getAttribute('data-nav');
    if(nav){
      viewM += +nav; if(viewM<0){viewM=11;viewY--;} if(viewM>11){viewM=0;viewY++;}
      selKey=null; $('sel').innerHTML=''; $('bottom').className=''; drawCal(); armBack(); return;
    }
    var p=t.getAttribute('data-d').split('-'), y=+p[0], m=+p[1], d=+p[2];
    if(m!==viewM){ viewY=y; viewM=m; }
    selKey=t.getAttribute('data-d'); showDay(y,m,d); drawCal(); armBack();
  }
  document.getElementById('right').addEventListener('click', onTap, false);

  // ===== Кухонные таймеры (до 3 штук) =====
  var timers = [], tSet = 300, actx = null, beepOn = false, tCount = 0;
  function fmt(sec){ sec=Math.max(0,Math.ceil(sec)); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), x=sec%60;
    return (h? h+':'+p2(m) : p2(m))+':'+p2(x); }
  function unlockAudio(){
    try{
      if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
      if(actx){ var b=actx.createBuffer(1,1,22050), src=actx.createBufferSource(); src.buffer=b; src.connect(actx.destination);
        if(src.start) src.start(0); else src.noteOn(0); if(actx.resume) actx.resume(); }
    }catch(e){}
  }
  function beep(){
    if(!actx) return;
    try{
      var t0=actx.currentTime;
      for(var i=0;i<3;i++){
        var o=actx.createOscillator(), g=actx.createGain();
        o.type='square'; o.frequency.value=1000; g.gain.value=0.25;
        o.connect(g); g.connect(actx.destination);
        var a=t0+i*0.25;
        if(o.start){ o.start(a); o.stop(a+0.15); } else { o.noteOn(a); o.noteOff(a+0.15); }
      }
    }catch(e){}
  }
  function openOv(){
    if(timers.length>=3){ return; }
    unlockAudio(); tSet=300; $('ovt').innerHTML=fmt(tSet); $('ov').className='on';
  }
  function drawTimers(){
    var now=new Date().getTime(), h='', anyDone=false;
    for(var i=0;i<timers.length;i++){
      var t=timers[i], left=(t.end-now)/1000;
      if(left<=0){ t.done=true; anyDone=true; }
      h += '<span class="tm'+(t.done?' done'+((Math.floor(now/500)%2)?' blink':''):'')+'" data-t="'+t.id+'"><small>'+t.name+'</small>'+
           (t.done?'ГОТОВО':fmt(left))+'</span>';
    }
    if(timers.length<3) h += '<span class="tm add" data-add="1">&#9201; '+(timers.length?'+':'Таймер')+'</span>';
    $('timers').innerHTML = h;
    beepOn = anyDone;
  }
  $('ov').addEventListener('click', function(e){
    var t=e.target, m=t.getAttribute('data-m'), a=t.getAttribute('data-a'), x=t.getAttribute('data-x');
    unlockAudio();
    if(m){ tSet=+m*60; } else if(a){ tSet=Math.max(10, tSet + +a); }
    else if(x==='cancel'){ $('ov').className=''; return; }
    else if(x==='start'){
      tCount++; timers.push({id:tCount, name:'Т'+tCount, end:new Date().getTime()+tSet*1000, done:false});
      $('ov').className=''; drawTimers(); return;
    }
    $('ovt').innerHTML=fmt(tSet);
  }, false);
  $('timers').addEventListener('click', function(e){
    var t=e.target; while(t && t.getAttribute && !t.getAttribute('data-t') && !t.getAttribute('data-add')) t=t.parentNode;
    if(!t || !t.getAttribute) return;
    if(t.getAttribute('data-add')){ openOv(); return; }
    var id=+t.getAttribute('data-t');
    for(var i=0;i<timers.length;i++) if(timers[i].id===id){
      // готовый таймер — убрать; идущий — убрать по второму нажатию (подтверждение)
      if(timers[i].done || timers[i].confirm){ timers.splice(i,1); }
      else { timers[i].confirm=true; timers[i].name='Убрать?'; (function(tt){ setTimeout(function(){ tt.confirm=false; tt.name='Т'+tt.id; },3000); })(timers[i]); }
      break;
    }
    if(!timers.length) tCount=0;
    drawTimers();
  }, false);
  $('left').addEventListener('click', openOv, false);
  drawTimers();
  setInterval(function(){ if(timers.length) drawTimers(); }, 250);
  setInterval(function(){ if(beepOn) beep(); }, 1000);

  function tick(){
    var now = new Date(), hr = now.getHours();
    $('time').innerHTML = p2(hr)+':'+p2(now.getMinutes());
    $('sec').innerHTML = p2(now.getSeconds());
    if(now.getDate()!==lastDay){
      lastDay = now.getDate();
      $('dow').innerHTML = DOW[now.getDay()];
      $('date').innerHTML = now.getDate()+' '+MON_G[now.getMonth()]+' '+now.getFullYear();
      goToday();
      drawEvents(now);
    }
    var night = NIGHT_FROM>NIGHT_TO ? (hr>=NIGHT_FROM||hr<NIGHT_TO) : (hr>=NIGHT_FROM&&hr<NIGHT_TO);
    document.body.className = night ? 'night' : '';
    // раз в 12 часов перезагружаемся днём, чтобы старый Safari не "уставал"
    if(now.getTime()-startedAt > 12*3600*1000 && now.getMinutes()===0 && !night && !timers.length){ location.reload(); }
    setTimeout(tick, 1000 - now.getMilliseconds() + 5);
  }
  tick();

  // ===== Погода =====
  // Без параметров: файл weather.json с этого же сайта (его раз в час обновляет GitHub, Винница).
  // Старый iOS 9 не открывает сервис погоды напрямую из-за сертификата, а наш сайт открывает.
  // Другой город: ?lat=..&lon=.. (запрос прямо в Open-Meteo, на iOS 9 может не работать).
  function qs(name){
    var m = new RegExp('[?&]'+name+'=([^&]+)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var lat = qs('lat'), lon = qs('lon');
  var WX = {0:'ясно',1:'малооблачно',2:'облачно',3:'пасмурно',45:'туман',48:'туман',
    51:'морось',53:'морось',55:'морось',61:'дождь',63:'дождь',65:'ливень',
    71:'снег',73:'снег',75:'сильный снег',77:'снег',80:'ливень',81:'ливень',82:'ливень',
    85:'снегопад',86:'снегопад',95:'гроза',96:'гроза',99:'гроза'};
  function weather(){
    var x = new XMLHttpRequest();
    var url = (lat&&lon) ? 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1'
      : 'weather.json?t='+new Date().getTime();
    x.open('GET',url,true);
    x.onreadystatechange = function(){
      if(x.readyState!==4) return;
      if(x.status!==200){ return; }
      try{
        var j = JSON.parse(x.responseText), c = j.current_weather;
        // устаревшие данные (старше 4 часов) не показываем
        var tm = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(c.time||'');
        if(tm){ var wt = new Date(+tm[1], +tm[2]-1, +tm[3], +tm[4], +tm[5]).getTime();
          if(new Date().getTime()-wt > 4*3600*1000){ $('weather').innerHTML=''; return; } }
        var t = Math.round(c.temperature);
        var s = (t>0?'+':'')+t+'°, '+(WX[c.weathercode]||'');
        if(j.daily){ s += '<br><small>сегодня '+Math.round(j.daily.temperature_2m_min[0])+'…'+Math.round(j.daily.temperature_2m_max[0])+'°</small>'; }
        $('weather').innerHTML = s;
      }catch(e){}
    };
    x.send();
  }
  weather(); setInterval(weather, 30*60*1000);
})();
</script>

</html>
