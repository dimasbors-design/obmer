name: Публикация на GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'   # каждые 10 минут: тревоги, свет и погода для часов (site/clock/*.json)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Кэш модели Vosk
        id: vosk
        uses: actions/cache@v4
        with:
          path: site/model/vosk-model-small-ru.tar.gz
          key: vosk-model-small-ru-0.22
      - name: Модель русской речи Vosk (small-ru 0.22)
        if: steps.vosk.outputs.cache-hit != 'true'
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mv vosk-model-small-ru-0.22 model
          mkdir -p site/model
          tar czf site/model/vosk-model-small-ru.tar.gz model
          ls -la site/model
      - name: Погода для часов (Винница)
        continue-on-error: true
        run: |
          curl -sf --retry 3 -o site/clock/weather.json \
            'https://api.open-meteo.com/v1/forecast?latitude=49.23&longitude=28.47&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1' \
            || rm -f site/clock/weather.json
          cat site/clock/weather.json || true
      - name: График отключений света для часов (Винницаоблэнерго, очередь 6.1)
        continue-on-error: true
        run: |
          # Открытые данные Світлобот (CC BY 4.0): https://github.com/Svitlobot-official/timetables
          curl -sf --retry 3 -o site/clock/power.json \
            'https://raw.githubusercontent.com/Svitlobot-official/timetables/main/vinnytsia/6.1.json' \
            || rm -f site/clock/power.json
          cat site/clock/power.json || true
      - name: Воздушные тревоги для часов (siren.pp.ua)
        continue-on-error: true
        run: python3 .github/scripts/alerts.py site/clock/alerts.json || rm -f site/clock/alerts.json
      - name: Новости Винницы для часов (RSS «20 хвилин»)
        continue-on-error: true
        run: python3 .github/scripts/news.py site/clock/news.json || rm -f site/clock/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
